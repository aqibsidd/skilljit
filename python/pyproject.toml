[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilljit"
version = "0.1.0"
description = "Just-in-time skill and MCP tool routing for Claude — install thousands of skills at the token cost of one."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "aqibsidd" }]
keywords = ["claude", "mcp", "agent-skills", "claude-code", "token-optimization"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/aqibsidd/skilljit"
Repository = "https://github.com/aqibsidd/skilljit"

[project.scripts]
skilljit = "skilljit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skilljit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Not `--workspaces --if-present`: that iterates workspaces in
      # directory-glob order (cli, core, mcp, proxy), building cli's
      # dependents before their dependencies exist. The root `build`
      # script orders it correctly (core -> proxy -> mcp -> cli).
      - run: npm run build
      - run: npm run test --workspaces --if-present
      - name: Skill-routing benchmark (recall@k)
        run: node bench/run.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e python/ pytest
      - run: pytest python/tests -q

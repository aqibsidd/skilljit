name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - name: Skill-routing benchmark (recall@k)
        run: node bench/run.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e python/ pytest
      - run: pytest python/tests -q
